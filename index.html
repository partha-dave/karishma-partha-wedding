<style>
  body { background: var(--cream); }
  .gate-wrap {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--side) 40px;
  }
  .gate-card { width: 100%; max-width: 460px; text-align: center; }

  .top-band { justify-content: center; align-items: center; gap: 10px; padding-top: 28px; }
  .top-band svg { color: var(--ink); flex: none; }
  .top-band svg.gate-dash--flip { transform: scaleX(-1); }

  .gate-badge { width: 120px; height: auto; margin: 22px auto 20px; display: block; }
  @media (min-width: 960px) { .gate-badge { width: 148px; } }

  .gate-title-wrap { position: relative; display: inline-block; }
  .gate-dash--title { position: absolute; top: -6px; left: -34px; color: var(--ink); }
  @media (min-width: 960px) { .gate-dash--title { top: 2px; left: -44px; width: 34px; height: 34px; } }
  .gate-star { position: absolute; top: -18px; right: -30px; }
  @media (min-width: 960px) { .gate-star { top: -14px; right: -40px; width: 34px; height: 34px; } }

  .gate-title {
    margin: 0;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: -.03em;
    line-height: .95;
    font-size: clamp(40px, 10vw, 72px);
    color: var(--ink);
  }
  .gate-heart { vertical-align: -.06em; margin-left: 6px; width: .58em; height: .58em; }

  .gate-instruction { margin: 26px 0 0; font: 500 16px/1.5 var(--font-body); color: var(--ink); }

  .gate-redirecting { margin: 22px 0 0; font: 500 16px/1.4 var(--font-body); color: var(--muted); }

  .gate-form { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .gate-input-wrap { position: relative; }
  .gate-input {
    width: 100%;
    box-sizing: border-box;
    font: 500 17px/1 var(--font-body);
    padding: 17px 52px 17px 22px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--cream);
    color: var(--ink);
    outline: none;
  }
  .gate-input::placeholder { color: var(--muted); }
  .gate-input:focus { border-color: var(--pink); }
  .gate-eye {
    position: absolute;
    top: 50%;
    right: 18px;
    transform: translateY(-50%);
    background: none;
    border: 0;
    padding: 4px;
    margin: 0;
    color: var(--ink);
    cursor: pointer;
    line-height: 0;
  }
  .gate-eye.is-active { color: var(--pink); }

  .gate-submit {
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font: 700 15px/1 var(--font-body);
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 17px 18px;
    border: 0;
    border-radius: 999px;
    background: var(--pink);
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease;
  }
  .gate-submit:hover { transform: scale(1.02); }
  .gate-submit .icon-arrow { flex: none; }

  .gate-error { font: 500 14px/1.4 var(--font-body); color: #c0335a; min-height: 18px; margin: -4px 0 0; }

  .gate-help { margin: 18px 0 0; font: 500 15px/1.4 var(--font-body); color: var(--ink); }
  .gate-help a { color: var(--ink); }
  .gate-help-heart { display: inline-block; width: 16px; height: auto; vertical-align: -2px; margin-left: 2px; }

  .gate-reset { display: none; margin-top: 18px; font: 500 14px/1 var(--font-body); color: var(--muted); text-decoration: underline; background: none; border: 0; cursor: pointer; padding: 0; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- reusable icon sprite -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="icon-arrow" viewBox="0 0 100 100">
    <path d="M12 50H84M65 30L85 50L65 70" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-plane-lines" viewBox="0 0 40 40">
    <path d="M6 24L1 31M16 21L14 32M25 21L29 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="top-band">
  <svg class="gate-dash" width="16" height="16" aria-hidden="true"><use href="#icon-plane-lines"/></svg>
  JULY &amp; AUGUST 2027
  <svg class="gate-dash gate-dash--flip" width="16" height="16" aria-hidden="true"><use href="#icon-plane-lines"/></svg>
</div>

<div class="gate-wrap">
  <div class="gate-card">
    <img class="gate-badge" src="icons/couple-badge.png" alt="Karishma + Partha Wedding 2027">

    <div class="gate-title-wrap">
      <svg class="gate-dash gate-dash--title" width="28" height="28" aria-hidden="true"><use href="#icon-plane-lines"/></svg>
      <svg class="gate-star" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2Z" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <h1 class="gate-title">Karishma + Partha<svg class="gate-heart" width="30" height="30" viewBox="0 0 32 29" aria-hidden="true"><path d="M16 28S2 19 2 9.5C2 4.8 5.6 1 10 1c2.6 0 4.9 1.3 6 3.3C17.1 2.3 19.4 1 22 1c4.4 0 8 3.8 8 8.5C30 19 16 28 16 28Z" fill="none" stroke="#F58BC1" stroke-width="2.2" stroke-linejoin="round"/></svg></h1>
    </div>

    <p class="gate-instruction">Enter your password to see the wedding details.</p>

    <p class="gate-redirecting" id="gate-redirecting" hidden>Taking you there now…</p>

    <form class="gate-form" id="gate-form">
      <div class="gate-input-wrap">
        <input class="gate-input" id="gate-password" type="password" autocomplete="off" placeholder="Password" aria-label="Password">
        <button class="gate-eye" id="gate-eye" type="button" aria-label="Show password">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </div>
      <button class="gate-submit" type="submit">Let me in <svg class="icon-arrow" width="18" height="18" aria-hidden="true"><use href="#icon-arrow"/></svg></button>
      <p class="gate-error" id="gate-error"></p>
    </form>

    <p class="gate-help">Need the password? <a href="mailto:karishma.partha2020@gmail.com">Just ask us</a><img class="gate-help-heart" src="icons/heart.png" alt="" aria-hidden="true"></p>

    <button class="gate-reset" id="gate-reset" type="button">Not you? Enter a different password</button>
  </div>
</div>

<script>
(function () {
  var DESTINATIONS = {
    "8078d899a37ff411404c220b749488ec0a91163ee3fc2266e61dd22e992641ac": "main/",
    "e32731fbc905264465dd0e59e2a48fa3e9396696fa382092b0e00f927c1d1ee1": "kakubhens-tribe/",
    "67b8f3c2fd1698dd799ec75e2ba71401a5fa4fc75c0fd4db09d5b36ee63849a3": "triple-famalam/"
  };
  var STORAGE_KEY = "kp-wedding-dest";

  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-password");
  var error = document.getElementById("gate-error");
  var resetBtn = document.getElementById("gate-reset");
  var redirecting = document.getElementById("gate-redirecting");
  var eyeBtn = document.getElementById("gate-eye");

  eyeBtn.addEventListener("click", function () {
    var showing = input.type === "text";
    input.type = showing ? "password" : "text";
    eyeBtn.classList.toggle("is-active", !showing);
    eyeBtn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function goTo(dest) {
    redirecting.hidden = false;
    form.hidden = true;
    resetBtn.style.display = "none";
    window.location.href = dest;
  }

  var validDests = Object.keys(DESTINATIONS).map(function (k) { return DESTINATIONS[k]; });
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

  if (saved && validDests.indexOf(saved) !== -1) {
    resetBtn.style.display = "inline-block";
    goTo(saved);
  }

  resetBtn.addEventListener("click", function () {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    redirecting.hidden = true;
    form.hidden = false;
    resetBtn.style.display = "none";
    error.textContent = "";
    input.value = "";
    input.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) return;
    error.textContent = "";
    sha256Hex(value).then(function (hash) {
      var dest = DESTINATIONS[hash];
      if (dest) {
        try { localStorage.setItem(STORAGE_KEY, dest); } catch (err) {}
        goTo(dest);
      } else {
        error.textContent = "That password isn't quite right — please try again.";
        input.select();
      }
    });
  });
})();
</script>

</body>
