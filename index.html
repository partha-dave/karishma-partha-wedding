<style>
  .gate-wrap {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px var(--side);
  }
  .gate-card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .gate-badge { width: 96px; height: auto; margin: 0 auto 18px; display: block; }
  .gate-title { font: 700 44px/1.05 var(--font-display); letter-spacing: .01em; margin: 0 0 10px; }
  @media (min-width: 960px) { .gate-title { font-size: 54px; } }
  .gate-note { font-family: var(--font-hand); font-weight: 700; font-size: 24px; color: var(--pink); margin: 0 0 28px; }
  .gate-form { display: flex; flex-direction: column; gap: 12px; }
  .gate-input {
    width: 100%;
    box-sizing: border-box;
    font: 500 17px/1 var(--font-body);
    padding: 16px 18px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--cream);
    text-align: center;
    outline: none;
  }
  .gate-input:focus { border-color: var(--pink); }
  .gate-submit {
    width: 100%;
    box-sizing: border-box;
    font: 700 15px/1 var(--font-body);
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 16px 18px;
    border: 0;
    border-radius: 999px;
    background: var(--pink);
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease;
  }
  .gate-submit:hover { transform: scale(1.02); }
  .gate-error {
    font: 500 14px/1.4 var(--font-body);
    color: #c0335a;
    min-height: 18px;
    margin: 2px 0 0;
  }
  .gate-redirecting {
    display: none;
    font: 500 16px/1.4 var(--font-body);
    color: var(--muted);
  }
  .gate-reset {
    display: none;
    margin-top: 18px;
    font: 500 14px/1 var(--font-body);
    color: var(--muted);
    text-decoration: underline;
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body style="background:var(--cream)">

<div class="gate-wrap">
  <div class="gate-card">
    <img class="gate-badge" src="icons/couple-badge.png" alt="Karishma + Partha Wedding 2027">
    <h1 class="gate-title">Karishma + Partha</h1>
    <p class="gate-note">Enter your password to see your wedding details ♥</p>

    <p class="gate-redirecting" id="gate-redirecting">Taking you there now…</p>

    <form class="gate-form" id="gate-form">
      <input class="gate-input" id="gate-password" type="password" autocomplete="off" placeholder="Password" aria-label="Password">
      <button class="gate-submit" type="submit">Enter</button>
      <p class="gate-error" id="gate-error"></p>
    </form>

    <button class="gate-reset" id="gate-reset" type="button">Not you? Enter a different password</button>
  </div>
</div>

<script>
(function () {
  var DESTINATIONS = {
    "8078d899a37ff411404c220b749488ec0a91163ee3fc2266e61dd22e992641ac": "main/",
    "e32731fbc905264465dd0e59e2a48fa3e9396696fa382092b0e00f927c1d1ee1": "kakubhens-tribe/",
    "67b8f3c2fd1698dd799ec75e2ba71401a5fa4fc75c0fd4db09d5b36ee63849a3": "triple-famalam/"
  };
  var STORAGE_KEY = "kp-wedding-dest";

  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-password");
  var error = document.getElementById("gate-error");
  var resetBtn = document.getElementById("gate-reset");
  var redirecting = document.getElementById("gate-redirecting");

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function goTo(dest) {
    redirecting.style.display = "block";
    form.hidden = true;
    resetBtn.style.display = "none";
    window.location.href = dest;
  }

  var validDests = Object.keys(DESTINATIONS).map(function (k) { return DESTINATIONS[k]; });
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

  if (saved && validDests.indexOf(saved) !== -1) {
    resetBtn.style.display = "inline-block";
    goTo(saved);
  }

  resetBtn.addEventListener("click", function () {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    redirecting.style.display = "none";
    form.hidden = false;
    resetBtn.style.display = "none";
    error.textContent = "";
    input.value = "";
    input.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) return;
    error.textContent = "";
    sha256Hex(value).then(function (hash) {
      var dest = DESTINATIONS[hash];
      if (dest) {
        try { localStorage.setItem(STORAGE_KEY, dest); } catch (err) {}
        goTo(dest);
      } else {
        error.textContent = "That password isn't quite right — please try again.";
        input.select();
      }
    });
  });
})();
</script>

</body>
</html>
